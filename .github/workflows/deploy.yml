# Cada push a main compila la web y la publica en Cloudflare Pages (proyecto topcode).
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: publicar
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx wrangler@4 pages deploy packages/web/dist --project-name topcode --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
