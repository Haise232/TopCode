<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // Redirige rutas SPA a index.html preservando la URL
    const repo = '/TopCode';
    const path = window.location.pathname.replace(repo, '') || '/';
    const search = window.location.search;
    const hash = window.location.hash;
    sessionStorage.setItem('spa_redirect', path + search + hash);
    window.location.replace(repo + '/');
  </script>
</head>
</html>
