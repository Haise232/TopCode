<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TopCode — Intranet académica para gestión de notas, apuntes y comunicación del equipo" />
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TopCode</title>

    <!--
      Preconnect to the Supabase project so the TLS handshake is done before
      the JS bundle fires its first API call.  Replace the placeholder with
      your real project URL (same value as VITE_SUPABASE_URL) when deploying.
      Using two separate <link> tags is the recommended pattern:
        1. preconnect  — opens socket + TLS early (crossorigin needed for CORS APIs)
        2. dns-prefetch — lightweight fallback for browsers that ignore preconnect
    -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Restaura la ruta SPA tras redirect desde 404.html (GitHub Pages) -->
    <script>
      const redirect = sessionStorage.getItem('spa_redirect');
      if (redirect) {
        sessionStorage.removeItem('spa_redirect');
        window.history.replaceState(null, '', redirect);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
