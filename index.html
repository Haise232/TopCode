<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TopCode — Intranet académica para gestión de notas, apuntes y comunicación del equipo" />
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TopCode</title>
    <!--
      Preconnect al proyecto Supabase: el plugin de Vite inyecta el hint exacto
      (con el slug del proyecto) durante el build cuando VITE_SUPABASE_URL está
      definida. Las líneas de abajo cubren el DNS compartido de la plataforma
      y sirven de fallback si el build corre sin la variable de entorno.
    -->
    <link rel="dns-prefetch" href="https://supabase.co" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Aplica el tema antes de que React monte para evitar flash -->
    <script>
      (function () {
        var t = localStorage.getItem('topcode-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Restaura la ruta SPA tras redirect desde 404.html (GitHub Pages) -->
    <script>
      const redirect = sessionStorage.getItem('spa_redirect');
      if (redirect) {
        sessionStorage.removeItem('spa_redirect');
        window.history.replaceState(null, '', redirect);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
